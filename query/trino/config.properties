# Trino node configuration — single-node coordinator.
#
# This replaces the image's default `/etc/trino/config.properties` only to cap
# memory: Trino's defaults assume a dedicated node and reserve far more than the
# container limit allows. Local filesystem access is enabled per-catalog with
# `fs.hadoop.enabled` in `catalog/delta.properties`, not here.

coordinator=true
node-scheduler.include-coordinator=true
http-server.http.port=8080
discovery.uri=http://localhost:8080
catalog.management=${ENV:CATALOG_MANAGEMENT}

# Keep the single JVM inside the container's memory limit. Trino's defaults
# assume a dedicated node and will happily try to reserve far more.
query.max-memory=512MB
query.max-memory-per-node=512MB
memory.heap-headroom-per-node=256MB
