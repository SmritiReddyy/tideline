# Trino catalog for the Tideline lakehouse.
#
# The file metastore keeps table metadata on local disk. It is fine for a
# single-node demo and explicitly unsupported for production — a real
# deployment points `hive.metastore` at Hive Metastore, AWS Glue, or Unity.
# Stating that here rather than discovering it later.

connector.name=delta_lake
hive.metastore=file
hive.metastore.catalog.dir=file:///data/lakehouse

# Read Delta tables from a `file://` mount. Trino 460+ requires a filesystem
# implementation to be selected explicitly; without one, every query fails with
# "No factory for location: file:///...". The Hadoop filesystem is the one that
# handles local paths. This is a testing-only setup — a real deployment uses
# `fs.native-s3.enabled` or `fs.native-gcs.enabled` against object storage, with
# a real metastore instead of the file-based one above.
fs.hadoop.enabled=true

# Trino may not write to these tables. The Spark job is the only writer, and a
# second writer against the same Delta log is how a lakehouse gets corrupted.
delta.enable-non-concurrent-writes=false

# Metadata caching. Aggressive caching on a table written every ten seconds
# would serve stale results; one minute is a compromise between query planning
# cost and freshness.
#
# Only the TTL is set. `delta.metadata.cache-size` was removed in Trino 460+
# and setting it makes the server refuse to start with "Defunct property" —
# a config that looks harmless and takes the whole catalog down.
delta.metadata.cache-ttl=1m

# The lakehouse writes files around 128 MB after compaction.
delta.target-max-file-size=128MB

# Lets an existing Delta table on disk be attached to this catalog with
# `CALL delta.system.register_table(...)`. Disabled by default because it
# attaches arbitrary filesystem paths as tables. Needed here because Spark owns
# table creation and Trino only reads what Spark already wrote.
delta.register-table-procedure.enabled=true
